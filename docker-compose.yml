services:
  # ─── MRIWL Backend API ──────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mriwl-backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=development
      - PORT=5000
      - MONGO_URI=mongodb://admin:admin@mongo:27017/mriwl_dev?authSource=admin
      - JWT_ACCESS_SECRET=dev_access_secret_change_me_in_production_32chars
      - JWT_REFRESH_SECRET=dev_refresh_secret_change_me_in_production_32char
      - JWT_ACCESS_EXPIRATION=15m
      - JWT_REFRESH_EXPIRATION=7d
      - CORS_ORIGIN=http://localhost:3000,http://localhost:5173,http://localhost:8080
      - RATE_LIMIT_WINDOW_MS=900000
      - RATE_LIMIT_MAX_REQUESTS=1000
      - CLOUDINARY_CLOUD_NAME=dev_cloud_name
      - CLOUDINARY_API_KEY=dev_api_key
      - CLOUDINARY_API_SECRET=dev_api_secret
      - SHIPPING_FLAT_RATE=0
      - LOG_LEVEL=debug
    depends_on:
      - mongo

  # ─── MongoDB Database ───────────────────────────────
  mongo:
    image: mongo:latest
    container_name: mriwl-mongo
    restart: always
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_ROOT_USERNAME=admin
      - MONGO_INITDB_ROOT_PASSWORD=admin
    volumes:
      - mongo_data:/data/db

  # ─── Mongo Express (Web GUI Admin) ──────────────────
  mongo-express:
    image: mongo-express:latest
    container_name: mriwl-mongo-express
    restart: always
    ports:
      - "8081:8081"
    environment:
      - ME_CONFIG_BASICAUTH_USERNAME=test
      - ME_CONFIG_BASICAUTH_PASSWORD=test
      - ME_CONFIG_MONGODB_SERVER=mongo
      - ME_CONFIG_MONGODB_ADMINUSERNAME=admin
      - ME_CONFIG_MONGODB_ADMINPASSWORD=admin
    depends_on:
      - mongo

volumes:
  mongo_data:
